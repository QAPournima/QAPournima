<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blogs | Pournima Tele</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #334155;
      --muted: #64748b;
      --title: #0f172a;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
    }
    .page { width: 100%; max-width: 1120px; margin: 0 auto; background: #fff; }
    .banner {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: cover;
      object-position: top;
    }
    .wrap { padding: 24px 22px 40px; background: var(--bg); }
    .back {
      display: inline-flex;
      margin-bottom: 14px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { margin: 0 0 6px; font-size: 28px; color: var(--title); }
    .intro { margin: 0 0 20px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid #edf2f7;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      min-height: 100%;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }
    .card:hover { border-color: #c7d2fe; transform: translateY(-2px); }
    .thumb {
      height: 168px;
      background: linear-gradient(135deg, #1e3a8a, #6d28d9);
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb .fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .thumb .fallback[hidden] { display: none; }
    .body { padding: 14px 15px 16px; display: flex; flex-direction: column; flex: 1; }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .src {
      background: #eef2ff;
      color: #3730a3;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--title);
      line-height: 1.35;
    }
    .card p {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .banner { height: 150px; object-position: top; }
      .wrap { padding: 16px 14px 28px; }
      h1 { font-size: 22px; }
      .grid { grid-template-columns: 1fr; }
    }

    html { scroll-behavior: smooth; }
    .site-foot {
      position: relative;
      z-index: 20;
      background: #f3f4f6;
      color: #6b7280;
      padding: 40px 28px 28px;
      margin-top: 8px;
    }
    .to-top {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -70%);
      width: 78px;
      height: 39px;
      border-radius: 78px 78px 0 0;
      background: #f3f4f6;
      color: #9ca3af;
      display: grid;
      place-items: end center;
      padding-bottom: 8px;
      text-decoration: none;
    }
    .to-top:hover { color: #4b5563; }
    .foot-inner {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 28px;
    }
    .site-foot p { margin: 0; font-size: 13px; }
    .site-foot nav { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .site-foot nav a {
      color: #6b7280;
      text-decoration: none;
      font-size: 13px;
    }
    .site-foot nav a:hover { color: #111827; }
    @media (max-width: 720px) {
      .foot-inner { justify-content: center; text-align: center; }
      .site-foot nav { justify-content: center; }
    }
  </style>
</head>
<body id="top">
  <div class="page">
    <img class="banner" src="./profile-assets/banner.png?v=5" alt="Pournima Tele banner" />
    <div class="wrap">
      <a class="back" href="./index.html">← Back to dashboard</a>
      <h1>Blogs</h1>
      <p class="intro">Posts from my Wix blog. Click a card to read the full article.</p>
      <div class="grid" id="list"></div>
    </div>
  </div>
  <script>
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }
    fetch("./writing/catalog.json")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        const list = document.getElementById("list");
        (data.posts || []).filter(function (post) { return post.source !== "medium"; }).forEach(function (post) {
          const a = document.createElement("a");
          a.className = "card";
          a.href = post.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          const initial = (post.title || "B").replace(/^[^\w]+/, "").charAt(0).toUpperCase() || "B";
          const thumb = post.image
            ? '<img src="' + esc(post.image) + '" alt="" /><div class="fallback" hidden>' + esc(initial) + "</div>"
            : '<div class="fallback">' + esc(initial) + "</div>";
          a.innerHTML =
            '<div class="thumb">' + thumb + "</div>" +
            '<div class="body">' +
            '<div class="meta"><span class="src">Blog</span><span>' + esc(post.displayDate) + "</span></div>" +
            "<h2>" + esc(post.title) + "</h2>" +
            "<p>" + esc(post.excerpt) + "</p>" +
            "</div>";
          list.appendChild(a);
          const img = a.querySelector("img");
          if (img) {
            img.addEventListener("error", function () {
              img.style.display = "none";
              const fb = a.querySelector(".fallback");
              if (fb) fb.hidden = false;
            });
          }
        });
      });
  </script>
  <footer class="site-foot">
    <a class="to-top" href="#top" aria-label="Back to top"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div class="foot-inner">
      <p>© 2026 Pournima Tele</p>
      <nav aria-label="Footer">
        <a href="./index.html">Home</a>
        <a href="./work-history.html">Work</a>
        <a href="./writing.html">Writing</a>
        <a href="./books.html">Books</a>
        <a href="./blogs.html">Blogs</a>
        <a href="mailto:pournima.csm@gmail.com">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>

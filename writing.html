<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writing | Pournima Tele</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #334155;
      --muted: #64748b;
      --title: #0f172a;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
    }
    .page { width: 100%; max-width: 1080px; margin: 0 auto; background: #fff; }
    .banner {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      object-position: center;
    }
    .wrap { padding: 24px 22px 40px; background: var(--bg); }
    .back {
      display: inline-flex;
      margin-bottom: 14px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { margin: 0 0 6px; font-size: 28px; color: var(--title); }
    .intro { margin: 0 0 18px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    .list { display: grid; gap: 12px; }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid #edf2f7;
      border-radius: 16px;
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }
    .card:hover { border-color: #c7d2fe; }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .src {
      background: #eef2ff;
      color: #3730a3;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .src.medium { background: #ecfdf3; color: #166534; }
    .card h2 { margin: 0 0 6px; font-size: 17px; color: var(--title); line-height: 1.35; }
    .card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
    @media (max-width: 720px) {
      .banner { height: 140px; }
      .wrap { padding: 16px 14px 28px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <img class="banner" src="./profile-assets/banner.png?v=5" alt="Pournima Tele banner" />
    <div class="wrap">
      <a class="back" href="./index.html">← Back to dashboard</a>
      <h1>Writing & blogs</h1>
      <p class="intro">All posts from my Wix blog, plus selected Medium articles. Click a card to read the full post.</p>
      <div class="list" id="list"></div>
    </div>
  </div>
  <script>
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }
    fetch("./writing/catalog.json")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        const list = document.getElementById("list");
        (data.posts || []).forEach(function (post) {
          const a = document.createElement("a");
          a.className = "card";
          a.href = post.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          const label = post.source === "medium" ? "Medium" : "Wix blog";
          a.innerHTML =
            '<div class="meta"><span class="src' + (post.source === "medium" ? " medium" : "") + '">' + label + "</span><span>" + esc(post.displayDate) + "</span></div>" +
            "<h2>" + esc(post.title) + "</h2>" +
            "<p>" + esc(post.excerpt) + "</p>";
          list.appendChild(a);
        });
      });
  </script>
</body>
</html>
